name: tictactoe_workspace
description: Workspace root. Holds no code — only the list of packages.
publish_to: none

environment:
  sdk: ^3.12.0

# One resolution, one lockfile, one `flutter pub get` for the whole tree. The members below
# refer to each other by name — no `path:` entries, no bootstrap step.
workspace:
  - apps/tictactoe
  - packages/features/game/domain
  - packages/features/game/presentation
  - packages/features/scoreboard/data
  - packages/features/scoreboard/domain
  - packages/features/scoreboard/presentation

dev_dependencies:
  very_good_analysis: ^6.0.0
