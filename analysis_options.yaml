include: package:very_good_analysis/analysis_options.6.0.0.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Codegen is checked in CI, so a missing `part` has to stay a hard error.
    missing_required_param: error
    missing_return: error
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    # Domain entities are value objects; alphabetical fields are the repo convention and
    # keep diffs readable.
    sort_constructors_first: true
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
    # Documenting every public symbol would be noise on a domain this small. Comments are
    # for a non-obvious *why*.
    public_member_api_docs: false
    lines_longer_than_80_chars: false
    # Two different reasons, both of which outlive the current method count. Repository
    # and strategy ports carry constructor-injected dependencies, which a typedef cannot
    # hold. Routing ports are named roles that grow: a second destination would mean a
    # second typedef, provider and bind parameter, where an interface keeps one name and
    # one binding. Single-method ports with neither property use a typedef instead —
    # `OnGameFinished` is one.
    one_member_abstracts: false
